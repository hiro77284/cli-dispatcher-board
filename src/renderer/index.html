<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>CLI ディスパッチャーボード</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <input id="search" type="search" placeholder="コマンドを検索（Ctrl+K）" autocomplete="off" />
    </div>
    <nav id="list"></nav>
    <div id="load-errors" hidden></div>
    <div class="side-foot">
      <button id="open-dir" class="ghost" title="定義フォルダを開く">フォルダを開く</button>
      <button id="reload" class="ghost" title="定義を読み直す">再読込</button>
    </div>
    <div id="version" class="version" title="バージョン"></div>
  </aside>

  <main id="main">
    <section id="top">
      <div id="empty" class="empty">左の一覧からコマンドを選んでください。</div>
      <div id="detail" hidden>
        <header class="detail-head">
          <div>
            <div id="cmd-category" class="category"></div>
            <h1 id="cmd-name"></h1>
          </div>
          <div class="head-actions">
            <button id="reset-values" class="ghost">既定値に戻す</button>
            <button id="open-def" class="ghost">定義ファイルを開く</button>
          </div>
        </header>
        <p id="cmd-desc" class="desc"></p>
        <form id="form" autocomplete="off"></form>
      </div>
    </section>

    <section id="runbar" hidden>
      <div class="preview-row">
        <code id="preview" title="組み立てたコマンドライン"></code>
        <button id="copy" class="ghost" title="コマンドラインをコピー">コピー</button>
      </div>
      <div id="validation"></div>
      <div class="action-row">
        <button id="run" class="primary" title="新しいタブで実行（Ctrl+Enter）">▶ 実行</button>
        <span class="hint">実行するたびに新しいタブが開き、同時にいくつでも動かせます</span>
      </div>
    </section>

    <div id="splitter" title="ドラッグで高さを変更"></div>
    <section id="term-area">
      <div class="tabbar">
        <div id="tabs"></div>
        <button id="close-done" class="ghost small" title="実行中でないタブをまとめて閉じる">終了したタブを閉じる</button>
      </div>
      <div class="tab-tools">
        <span id="status" class="status"></span>
        <span class="spacer"></span>
        <button id="stop" class="danger small" disabled title="Ctrl+C を送る。もう一度押すと強制終了">■ 停止</button>
        <button id="rerun" class="ghost small" disabled title="このタブで同じ値のまま実行し直す">↻ 再実行</button>
        <button id="clear" class="ghost small" disabled>出力を消去</button>
      </div>
      <div id="term-wrap">
        <div id="term-empty" class="empty">ここに実行結果が表示されます。実行中は出力欄に直接キー入力できます（y/n の確認など）。<br />タブの切り替えは Ctrl+Tab、閉じるのは × か中クリックです。</div>
      </div>
    </section>
  </main>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
